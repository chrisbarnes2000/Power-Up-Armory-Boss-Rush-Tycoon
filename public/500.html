<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>500 - System Overload | Power-Up Armory</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #070a14;
      color: #e2e8f0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      background-image: radial-gradient(circle at 50% 20%, rgba(239, 68, 68, 0.15), transparent 60%);
    }
    .card {
      background: #0f172a;
      border: 1px solid rgba(239, 68, 68, 0.3);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.15);
      border-radius: 1.25rem;
      padding: 2.5rem;
      max-width: 520px;
      width: 100%;
      text-align: center;
    }
    .code-badge {
      display: inline-block;
      font-family: monospace;
      font-weight: 900;
      font-size: 3.5rem;
      color: #ef4444;
      text-shadow: 0 0 20px rgba(239, 68, 68, 0.5);
      margin-bottom: 0.5rem;
      line-height: 1;
    }
    .title {
      font-size: 1.5rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 1rem;
      letter-spacing: -0.02em;
    }
    .desc {
      font-size: 0.95rem;
      color: #94a3b8;
      line-height: 1.6;
      margin-bottom: 2rem;
      font-family: monospace;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #ef4444, #b91c1c);
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.85rem 1.75rem;
      border-radius: 9999px;
      text-decoration: none;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(239, 68, 68, 0.6);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="code-badge">500</div>
    <h1 class="title">Core Overclock Malfunction</h1>
    <p class="desc">
      [ERR_INTERNAL_SERVER]: The armory server core overheated from critical boss energy surge. Automated firewalls have stabilized the mainframe.
    </p>
    <a href="/" class="btn">
      <span>⚡ Reboot & Return</span>
    </a>
  </div>
</body>
</html>
